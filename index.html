<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<!-- 去掉 maximum-scale=1：禁止缩放会让低视力用户无法放大正文（WCAG 1.4.4） -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#285448">
<meta name="description" content="词阅 Ciyue —— 把感兴趣的英文内容变成 CET 学习材料">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>词阅 Ciyue · 兴趣驱动的英文阅读</title>
<link rel="manifest" href="manifest.webmanifest?v=83">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<!-- 自托管拉丁字体：中文正文走系统字体，只有 DM Sans / Inter Tight 的拉丁字形从这里加载 -->
<link rel="stylesheet" href="assets/fonts.css?v=83">
<link rel="stylesheet" href="assets/styles.css?v=83">
<link rel="stylesheet" href="assets/editorial.css?v=83">
</head>
<body>
  <div class="phone">
    <div class="screen" id="screen"></div>
  </div>

  <!-- 导入备份用的隐藏文件选择框 -->
  <input type="file" id="file-in" accept="application/json,.json" hidden>
  <input type="file" id="library-file-in" accept="application/json,.json" hidden>
  <input type="file" id="cv-file-in" accept=".txt,.csv,.json,text/plain,text/csv,application/json" hidden>

  <!-- 数据按顺序延后加载；公开内容仅包含短 Demo，私人文章由 IndexedDB 提供。 -->
  <script defer src="assets/data.js?v=83"></script>
  <script defer src="assets/data/demo-articles.js?v=83"></script>
  <script defer src="assets/services/article-schema.js?v=83"></script>
  <script defer src="assets/services/article-store.js?v=83"></script>
  <script defer src="assets/services/content-loader.js?v=83"></script>
  <script defer src="assets/data-config.js?v=83"></script>
  <script defer src="assets/data-words-bulk-a.js?v=83"></script>
  <script defer src="assets/data-words-full.js?v=83"></script>
  <!-- 中学基础层：核心库默认你会了、实际却没收的 2068 个中学词（必须排在 app.js 之前） -->
  <script defer src="assets/data-words-mid.js?v=83"></script>
  <!-- CET-4 完整大纲词表（4544 词）：只服务「词汇高亮范围」的「全部四级」档，
       不参与查词 —— 高亮范围与查词范围是两件事（见 app.js 的 highlightSet） -->
  <script defer src="assets/data-words-cet4.js?v=83"></script>
  <!-- 真实例句（560KB）不在首屏：它只在词卡展开「更多」后才用得上，
       改由 app.js 的 ensureExamples() 动态取（见 assets/app.js） -->
  <!-- ECDICT 四级词元数据：词频排序 / 权威词形表（必须在 app.js 之前） -->
  <script defer src="assets/data-ecdict.js?v=83"></script>
  <!-- 点词翻译层在进入阅读页后由 app.js 按需加载，首屏不再下载 3MB 大表。 -->
  <!-- 常见词表：判断词库外的词算不算陌生（生成产物，必须在 app.js 之前） -->
  <script defer src="assets/data-wordfreq.js?v=83"></script>
  <script defer src="assets/app.js?v=83"></script>
</body>
</html>

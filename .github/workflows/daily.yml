# 词阅 WordLens —— 每日自动更新 + 发布
#
# 每天北京时间 07:00（UTC 23:00）运行：
#   1. 跑 tools/daily.mjs（抓取 → 质检 → 例句 → 瘦身发布 → 回归）
#   2. 数据有变动则提交回仓库
#   3. 把整站发布到 GitHub Pages
# 任何一步失败，workflow 标红，站点保持昨天的数据（daily.mjs 内部有快照回滚）。
name: daily-update

on:
  schedule:
    - cron: "0 23 * * *"   # UTC 23:00 = 北京时间次日 07:00
  workflow_dispatch:         # 支持手动触发（Actions 页面点 Run workflow）
  push:
    branches: [ main ]       # 每次推送直接部署站点（不跑抓取，避免更新循环）

permissions:
  contents: write            # 推送数据提交
  pages: write               # 发布 Pages
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'   # 抓取更新只在定时/手动时跑
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 每日抓取与质检
        run: node tools/daily.mjs

      - name: 提交数据更新
        run: |
          git config user.name "wordlens-bot"
          git config user.email "wordlens-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "daily update $(date -u +%F)" && git push)

  deploy:
    needs: update
    # push 事件：update 被跳过，直接部署当前内容；定时/手动事件：update 成功才部署
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.update.result == 'success') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true    # 首次运行自动开启仓库的 Pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - id: deployment
        uses: actions/deploy-pages@v4

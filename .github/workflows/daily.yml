# 词阅 WordLens —— 每日自动更新 + 发布
#
# 每天北京时间 07:00（UTC 23:00）运行：
#   1. 跑 tools/daily.mjs（抓取 → 质检 → 例句 → 瘦身发布 → 回归）
#   2. 数据有变动则提交回仓库
#   3. 把整站发布到 GitHub Pages
# 任何一步失败，workflow 标红，站点保持昨天的数据（daily.mjs 内部有快照回滚）。
name: daily-update

on:
  schedule:
    - cron: "0 23 * * *"   # UTC 23:00 = 北京时间次日 07:00
  workflow_dispatch:         # 支持手动触发（Actions 页面点 Run workflow）
  push:
    branches: [ main ]       # 每次推送直接部署站点（不跑抓取，避免更新循环）

permissions:
  contents: write            # 推送数据提交
  pages: write               # 发布 Pages
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'   # 抓取更新只在定时/手动时跑
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 安装图片压缩依赖
        run: python -m pip install --disable-pip-version-check Pillow

      - name: 每日抓取与质检
        run: node tools/daily.mjs
        env:
          DEEPL_KEY: ${{ secrets.DEEPL_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: ${{ vars.DASHSCOPE_BASE_URL }}
          QWEN_MT_MODEL: ${{ vars.QWEN_MT_MODEL }}
          # 人物偏好名单（people[] + excludedPeople）。仓库是 public，这份内容不随仓库走，
          # 只以 Secret 注入 —— 缺失时 lib-people.mjs 会告警并用空名单，不会让 workflow 变红。
          PEOPLE_PRIVATE_JSON: ${{ secrets.PEOPLE_PRIVATE_JSON }}

      - name: 提交数据更新
        id: commit
        run: |
          git config user.name "wordlens-bot"
          git config user.email "wordlens-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "daily update $(date -u +%F)"
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # 回归闸门（2026-09-23）：push 事件此前完全绕过回归 —— update 被跳过、deploy 直接
  # 部署触发提交，一次手滑推送的坏代码当天就上线。定时/手动事件不需要这个 job：
  # daily.mjs 内部末尾就带回归，update 失败本来就会挡住 deploy。
  # audit.js + doc-numbers.mjs 都是零依赖纯静态检查（473 守卫 + 篇数/版本硬校验）。
  gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 静态回归闸门
        run: |
          node tools/audit.js
          node tools/doc-numbers.mjs

  deploy:
    needs: [update, gate]
    # push 事件：update 跳过，gate 全绿才部署当前内容；定时/手动事件：update 成功才部署
    #（gate 此时是 skipped，不得挡路 —— 与下面 !cancelled() 同一套显式结果判断）。
    if: ${{ !cancelled() && ((github.event_name == 'push' && needs.gate.result == 'success') || needs.update.result == 'success') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 定时/手动更新后部署刚刚提交的树；push 事件部署触发该 workflow 的提交。
          ref: ${{ github.event_name == 'push' && github.sha || needs.update.outputs.commit_sha }}

      - uses: actions/configure-pages@v5
        with:
          enablement: true    # 首次运行自动开启仓库的 Pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - id: deployment
        uses: actions/deploy-pages@v4
